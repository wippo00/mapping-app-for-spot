<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambio password - Spot Mapping App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #edf2ee;
            color: #17211d;
        }

        .password-card {
            width: min(460px, 100%);
            padding: 26px;
            border: 1px solid #d9e2dc;
            border-radius: 16px;
            background: white;
            box-shadow: 0 8px 25px rgba(23, 63, 50, 0.10);
        }

        h1 {
            margin: 0;
            color: #173f32;
            font-size: 28px;
        }

        p {
            margin: 8px 0 20px;
            color: #64726b;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 800;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #cfd9d3;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 18px;
            border: 0;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #1d6b4c, #338d69);
            font-size: 16px;
            font-weight: 850;
            cursor: pointer;
        }

        .notice {
            margin: 0 0 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .notice.error {
            color: #8f2f2f;
            background: #fff1f1;
            border: 1px solid #e6b8b8;
        }

        .notice.success {
            color: #20523d;
            background: #eff8f2;
            border: 1px solid #cfe3d4;
        }

        .login-link {
            display: block;
            margin-top: 16px;
            color: #1e3a2d;
            font-weight: 850;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="password-card">
        <h1>Cambio password</h1>
        <p>Aggiorna la password inserendo username e vecchia password.</p>

        {% if error %}
            <div class="notice error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="notice success">{{ success }}</div>
        {% endif %}

        <form method="post" action="/change-password">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>

            <label for="old_password">Vecchia password</label>
            <input
                id="old_password"
                name="old_password"
                type="password"
                autocomplete="current-password"
                required
            >

            <label for="new_password">Nuova password</label>
            <input
                id="new_password"
                name="new_password"
                type="password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Conferma nuova password</label>
            <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button type="submit">Aggiorna password</button>
        </form>

        <a class="login-link" href="/login">Torna al login</a>
    </main>
</body>
</html>
