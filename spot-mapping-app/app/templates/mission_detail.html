<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dettaglio missione - Spot Mapping App</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f5;
            color: #1f2933;
        }

        header {
            background: #1e3a2d;
            color: white;
            padding: 20px 30px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: 30px;
            line-height: 1.08;
        }

        header p {
            margin: 0;
            color: rgba(255, 255, 255, 0.78);
            font-size: 15px;
            line-height: 1.35;
        }

        .account-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 22px;
        }

        a {
            color: #1e3a2d;
            font-weight: bold;
            text-decoration: none;
        }

        .settings-link,
        .logout-form button {
            border: 0;
            border-radius: 999px;
            min-height: 34px;
            color: #e7fff0;
            background: rgba(12, 26, 20, 0.28);
            font-size: 12px;
            font-weight: 750;
            text-decoration: none;
        }

        .settings-link {
            max-width: 120px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1;
        }

        .logout-form {
            margin: 0;
        }

        .logout-form button {
            padding: 0 12px;
            cursor: pointer;
        }

        .detail-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .back-link {
            color: #1e3a2d;
            font-size: 17px;
            font-weight: 850;
        }

        .pdf-button {
            min-height: 42px;
            border: 0;
            border-radius: 10px;
            padding: 0 14px;
            color: white;
            background: #2f8a68;
            font-family: inherit;
            font-size: 15px;
            font-weight: 850;
            cursor: pointer;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }

        .card {
            min-width: 0;
            padding: 14px 16px;
            background: white;
            border: 1px solid #d5ddd8;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .card strong {
            display: block;
            margin-bottom: 6px;
            color: #476356;
            font-size: 14px;
            line-height: 1.2;
        }

        #map {
            width: 100%;
            height: 560px;
            margin-top: 18px;
            border-radius: 8px;
            border: 1px solid #d5ddd8;
        }

        .report-section {
            margin-top: 18px;
            background: white;
            border: 1px solid #d5ddd8;
            border-radius: 8px;
            padding: 14px;
        }

        .report-section h2 {
            margin: 0 0 12px;
        }

        .vertices-table {
            width: 100%;
            border-collapse: collapse;
        }

        .vertices-table th,
        .vertices-table td {
            padding: 9px 10px;
            border: 1px solid #d5ddd8;
            text-align: left;
        }

        .vertices-table th {
            background: #e5eee8;
            color: #1e3a2d;
        }

        .message {
            margin: 8px 0;
            padding: 9px;
            background: #f8fafc;
            border-left: 4px solid #2563eb;
        }

        .warning {
            border-left-color: #d97706;
        }

        @media (max-width: 760px) {
            header {
                padding: 18px 22px;
            }

            .header-row {
                align-items: center;
            }

            header h1 {
                margin-bottom: 3px;
                font-size: 28px;
            }

            header p {
                max-width: 260px;
                font-size: 14px;
            }

            main {
                padding: 16px 14px;
            }

            .detail-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .back-link,
            .pdf-button {
                width: 100%;
            }

            .back-link {
                display: block;
                padding: 2px 0;
                font-size: 16px;
            }

            .pdf-button {
                min-height: 46px;
            }

            .info-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin: 14px 0;
            }

            .card {
                padding: 12px;
                font-size: 17px;
            }

            .card strong {
                font-size: 13px;
            }

            .card.wide {
                grid-column: 1 / -1;
            }

            #map {
                height: 360px;
            }

            .report-section {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-row">
            <div>
                <h1>Dettaglio missione</h1>
                <p>Area, parametri e comunicazioni ricevute dal simulatore Spot.</p>
            </div>

            <div class="account-actions">
                <a
                    class="settings-link"
                    href="{{ '/admin/users' if current_user.role in ['admin', 'subadmin'] else '/account' }}"
                    aria-label="Account {{ current_user.username }}"
                    title="{{ current_user.username }}"
                >
                    {{ current_user.username }}
                </a>
                <form class="logout-form" method="post" action="/logout">
                    <button type="submit">Esci</button>
                </form>
            </div>
        </div>
    </header>

    <main>
        <div class="detail-actions">
            <a class="back-link" href="/history">← Torna allo storico missioni</a>
            <button id="downloadReportButton" class="pdf-button">
                Scarica report PDF
            </button>
        </div>

        <section class="info-grid" id="missionInfo"></section>

        <section id="vertices" class="report-section">
            <h2>Vertici georeferenziati del poligono</h2>
            <div id="verticesList">Caricamento vertici...</div>
        </section>

        <div id="map"></div>

        <section id="messages" class="report-section">
            <h2>Messaggi Spot</h2>
            <div id="messagesList">Caricamento messaggi...</div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const missionId = {{ mission_id }};

        const map = L.map("map", { maxZoom: 22 });

        const streetLayer = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 22,
                maxNativeZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        );

        const satelliteLayer = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 22,
                maxNativeZoom: 19,
                attribution: "Tiles &copy; Esri"
            }
        );

        streetLayer.addTo(map);

        L.control.layers(
            {
                "Mappa stradale": streetLayer,
                "Satellite": satelliteLayer
            },
            null,
            { position: "topright" }
        ).addTo(map);

        function toLocalMeters(lat, lng, originLat, originLng) {
            const metersPerDegreeLat = 111320;
            const metersPerDegreeLng =
                111320 * Math.cos(originLat * Math.PI / 180);

            return {
                x: (lng - originLng) * metersPerDegreeLng,
                y: (lat - originLat) * metersPerDegreeLat
            };
        }

        function toLatLng(x, y, originLat, originLng) {
            const metersPerDegreeLat = 111320;
            const metersPerDegreeLng =
                111320 * Math.cos(originLat * Math.PI / 180);

            return {
                lat: originLat + y / metersPerDegreeLat,
                lng: originLng + x / metersPerDegreeLng
            };
        }

        function rotatePoint(point, angleRadians) {
            return {
                x: point.x * Math.cos(angleRadians) - point.y * Math.sin(angleRadians),
                y: point.x * Math.sin(angleRadians) + point.y * Math.cos(angleRadians)
            };
        }

        function pointInsidePolygon(point, polygon) {
            let inside = false;

            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x;
                const yi = polygon[i].y;
                const xj = polygon[j].x;
                const yj = polygon[j].y;

                const intersects =
                    ((yi > point.y) !== (yj > point.y)) &&
                    point.x < ((xj - xi) * (point.y - yi)) / (yj - yi) + xi;

                if (intersects) {
                    inside = !inside;
                }
            }

            return inside;
        }

        function formatDuration(seconds) {
            if (!seconds || seconds < 60) {
                return `${seconds || 0} s`;
            }

            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;

            if (remainingSeconds === 0) {
                return `${minutes} min`;
            }

            return `${minutes} min ${remainingSeconds} s`;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderVerticesTable(vertices) {
            const rows = vertices.map(function(vertex, index) {
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${vertex.latitude.toFixed(6)}</td>
                        <td>${vertex.longitude.toFixed(6)}</td>
                    </tr>
                `;
            }).join("");

            document.getElementById("verticesList").innerHTML = `
                <table class="vertices-table">
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Latitudine</th>
                            <th>Longitudine</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function drawSavedGrid(vertices, cellSize, rotationDegrees) {
            const originLat = vertices[0].latitude;
            const originLng = vertices[0].longitude;

            const polygonMeters = vertices.map(function(vertex) {
                return toLocalMeters(
                    vertex.latitude,
                    vertex.longitude,
                    originLat,
                    originLng
                );
            });

            const originalXs = polygonMeters.map(p => p.x);
            const originalYs = polygonMeters.map(p => p.y);

            const pivot = {
                x: (Math.min(...originalXs) + Math.max(...originalXs)) / 2,
                y: (Math.min(...originalYs) + Math.max(...originalYs)) / 2
            };

            const rotationRadians = rotationDegrees * Math.PI / 180;

            const rotatedPolygon = polygonMeters.map(function(point) {
                return rotatePoint(
                    { x: point.x - pivot.x, y: point.y - pivot.y },
                    -rotationRadians
                );
            });

            const xs = rotatedPolygon.map(p => p.x);
            const ys = rotatedPolygon.map(p => p.y);

            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);

            const estimatedCells =
                Math.ceil((maxX - minX) / cellSize) *
                Math.ceil((maxY - minY) / cellSize);

            if (estimatedCells > 3000) {
                return;
            }

            for (let x = minX; x < maxX; x += cellSize) {
                for (let y = minY; y < maxY; y += cellSize) {
                    const localCorners = [
                        { x: x, y: y },
                        { x: x + cellSize, y: y },
                        { x: x + cellSize, y: y + cellSize },
                        { x: x, y: y + cellSize }
                    ];

                    const actualCorners = localCorners.map(function(corner) {
                        const rotatedBack = rotatePoint(corner, rotationRadians);

                        return {
                            x: rotatedBack.x + pivot.x,
                            y: rotatedBack.y + pivot.y
                        };
                    });

                    const localCenter = {
                        x: x + cellSize / 2,
                        y: y + cellSize / 2
                    };

                    const centerBack = rotatePoint(localCenter, rotationRadians);

                    const actualCenter = {
                        x: centerBack.x + pivot.x,
                        y: centerBack.y + pivot.y
                    };

                    const hasCornerInside = actualCorners.some(function(corner) {
                        return pointInsidePolygon(corner, polygonMeters);
                    });

                    const centerInside = pointInsidePolygon(
                        actualCenter,
                        polygonMeters
                    );

                    if (!hasCornerInside && !centerInside) {
                        continue;
                    }

                    const latLngCorners = actualCorners.map(function(corner) {
                        const latLng = toLatLng(
                            corner.x,
                            corner.y,
                            originLat,
                            originLng
                        );

                        return [latLng.lat, latLng.lng];
                    });

                    L.polygon(latLngCorners, {
                        color: "#1565c0",
                        weight: 1,
                        fillOpacity: 0.05
                    }).addTo(map);
                }
            }
        }

        async function loadMission() {
            const response = await fetch(`/missions/${missionId}`);

            if (response.status === 401) {
                window.location.href = `/login?next=/mission/${missionId}`;
                return;
            }

            if (!response.ok) {
                document.getElementById("missionInfo").innerHTML =
                    "<p>Missione non trovata.</p>";
                return;
            }

            const mission = await response.json();

            document.getElementById("missionInfo").innerHTML = `
                <div class="card"><strong>ID missione</strong>#${mission.id}</div>
                <div class="card wide"><strong>Nome missione</strong>${escapeHtml(mission.name || `Missione #${mission.id}`)}</div>
                <div class="card"><strong>Account</strong>${escapeHtml(mission.username || "Non assegnato")}</div>
                <div class="card"><strong>Dipartimento</strong>${escapeHtml(mission.department || "-")}</div>
                <div class="card"><strong>Città</strong>${escapeHtml(mission.city || "-")}</div>
                <div class="card wide"><strong>Stato</strong>${escapeHtml(mission.status_label || mission.status)}</div>
                <div class="card wide"><strong>Data invio</strong>${escapeHtml(mission.created_at.replace("T", " "))}</div>
                <div class="card"><strong>Area</strong>${mission.area_m2.toFixed(1)} m²</div>
                <div class="card"><strong>Dimensione celle</strong>${mission.cell_size_m} m</div>
                <div class="card"><strong>Quadrati griglia</strong>${mission.grid_cell_count}</div>
                <div class="card"><strong>Rotazione griglia</strong>${mission.grid_rotation_deg}°</div>
                <div class="card"><strong>Durata stimata</strong>${formatDuration(mission.estimated_duration_seconds)}</div>
                <div class="card"><strong>Vertici poligono</strong>${mission.polygon_vertices.length}</div>
                <div class="card wide"><strong>Posizione iniziale GPS</strong>
                    ${mission.robot_latitude.toFixed(6)}, ${mission.robot_longitude.toFixed(6)}
                </div>
            `;

            renderVerticesTable(mission.polygon_vertices);

            const polygonPoints = mission.polygon_vertices.map(function(vertex) {
                return [vertex.latitude, vertex.longitude];
            });

            L.polygon(polygonPoints, {
                color: "green",
                fillColor: "green",
                fillOpacity: 0.18
            }).addTo(map);

            L.marker([
                mission.robot_latitude,
                mission.robot_longitude
            ])
                .addTo(map)
                .bindPopup("Posizione iniziale di Spot");

            drawSavedGrid(
                mission.polygon_vertices,
                mission.cell_size_m,
                mission.grid_rotation_deg
            );

            map.fitBounds(polygonPoints, {
                padding: [35, 35]
            });
        }

        async function loadMessages() {
            const response = await fetch(`/missions/${missionId}/messages`);

            if (!response.ok) {
                return;
            }

            const messages = await response.json();
            const list = document.getElementById("messagesList");

            if (messages.length === 0) {
                list.innerHTML = "<p>Nessun messaggio associato.</p>";
                return;
            }

            list.innerHTML = messages.map(function(message) {
                const warningClass =
                    message.level === "WARNING" ? "warning" : "";

                return `
                    <div class="message ${warningClass}">
                        <strong>${escapeHtml(message.level)}</strong><br>
                        <small>${escapeHtml(message.created_at.replace("T", " "))}</small><br>
                        ${escapeHtml(message.text)}
                    </div>
                `;
            }).join("");
        }

        document.getElementById("downloadReportButton").addEventListener("click", function () {
            window.location.href = `/missions/${missionId}/report.pdf`;
        });

        loadMission();
        loadMessages();
    </script>
</body>
</html>
